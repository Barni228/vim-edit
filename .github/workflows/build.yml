name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Sets up the MSVC environment (compiler, VCToolsRedistDir for the CRT DLLs).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Qt 6.11+ for Windows uses a repository layout that aqtinstall 3.3
      # can't read yet, so stay on 6.10 here until it does.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          arch: win64_msvc2022_64
          cache: true
          # Older aqtinstall releases can't download recent Qt versions.
          aqtversion: ">=3.1"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true
          # Older aqtinstall releases can't download recent Qt versions.
          aqtversion: ">=3.1"

      - name: Build disk image
        run: ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # Pushing a tag like v0.1.0 publishes both installers as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
